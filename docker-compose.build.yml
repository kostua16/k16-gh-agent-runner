# Build overlay — use with: make build (reads committed env.build)
services:
  runner:
    build:
      context: .
      args:
        NODE_MAJOR: ${NODE_MAJOR:-22}
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        GH_VERSION: ${GH_VERSION:-2.93.0}
        GSD_VERSION: ${GSD_VERSION:-1.1.0}
        RTK_VERSION: ${RTK_VERSION:-0.35.0}
        RTK_INSTALL_SHA256: ${RTK_INSTALL_SHA256:-9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66}
        PRISMA_VERSION: ${PRISMA_VERSION:-latest}
        ACTIONLINT_VERSION: ${ACTIONLINT_VERSION:-1.7.7}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        GEMINI_CLI_VERSION: ${GEMINI_CLI_VERSION:-latest}
        DOCKER_VERSION: ${DOCKER_VERSION:-28.0.4}
        DOCKER_COMPOSE_VERSION: ${DOCKER_COMPOSE_VERSION:-2.38.2}
        YQ_VERSION: ${YQ_VERSION:-4.45.1}
        SHFMT_VERSION: ${SHFMT_VERSION:-3.10.0}
        HADOLINT_VERSION: ${HADOLINT_VERSION:-2.12.0}
        GITLEAKS_VERSION: ${GITLEAKS_VERSION:-8.22.1}
        UV_VERSION: ${UV_VERSION:-0.6.14}
        AI_TOOLS_CACHE_BUST: ${AI_TOOLS_CACHE_BUST:-}
        INSTALL_RTK: ${INSTALL_RTK:-true}
        INSTALL_GSD: ${INSTALL_GSD:-true}
        INSTALL_PRISMA: ${INSTALL_PRISMA:-true}
        INSTALL_ACTIONLINT: ${INSTALL_ACTIONLINT:-true}
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-true}
        INSTALL_CODEX: ${INSTALL_CODEX:-true}
        INSTALL_CURSOR_AGENT: ${INSTALL_CURSOR_AGENT:-true}
        INSTALL_GEMINI_CLI: ${INSTALL_GEMINI_CLI:-true}
        INSTALL_ANTIGRAVITY_CLI: ${INSTALL_ANTIGRAVITY_CLI:-true}
    image: ${RUNNER_IMAGE:-ghcr.io/kostua16/k16-gh-agent-runner:latest}
