name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "runner.sh"
      - "scripts/install-*.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
            cache: ghcr.io/${{ github.repository }}:buildcache-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            cache: ghcr.io/${{ github.repository }}:buildcache-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.suffix }}
          labels: ${{ needs.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.cache }}
          cache-to: type=registry,ref=${{ matrix.cache }},mode=max
          build-args: |
            NODE_MAJOR=22
            BUN_VERSION=1.3.14
            GH_VERSION=2.93.0
            GSD_VERSION=1.1.0
            RTK_VERSION=0.35.0
            RTK_INSTALL_SHA256=9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66
            PRISMA_VERSION=latest
            ACTIONLINT_VERSION=1.7.7
            CLAUDE_CODE_VERSION=latest
            CODEX_VERSION=latest
            GEMINI_CLI_VERSION=latest
            AI_TOOLS_CACHE_BUST=
            INSTALL_RTK=true
            INSTALL_GSD=true
            INSTALL_PRISMA=true
            INSTALL_ACTIONLINT=true
            INSTALL_CLAUDE_CODE=true
            INSTALL_CODEX=true
            INSTALL_CURSOR_AGENT=true
            INSTALL_GEMINI_CLI=true
            INSTALL_ANTIGRAVITY_CLI=true

  merge:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Create and push multi-platform manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(--tag "$tag")
          done <<<"$TAGS"

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
