services:
  cache-server:
    image: ghcr.io/falcondev-oss/github-actions-cache-server
    environment:
      API_BASE_URL: http://cache-server:3000
      STORAGE_DRIVER: filesystem
      STORAGE_FILESYSTEM_PATH: /data/cache
      DB_DRIVER: sqlite
      DB_SQLITE_PATH: /data/cache-server.db
    volumes:
      - cache-data:/data
    restart: unless-stopped

  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/kostua16/k16-gh-agent-runner:latest}
    depends_on:
      - cache-server
    env_file:
      - .env
    environment:
      CUSTOM_ACTIONS_RESULTS_URL: http://cache-server:3000/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  cache-data:
